apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-volume
  namespace: music
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/app: music
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-music: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 150Gi
