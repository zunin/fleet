apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: images
  namespace: readlater
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/app: readlater
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-readlater: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
