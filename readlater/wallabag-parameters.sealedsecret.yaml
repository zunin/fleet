apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wallabag-parameters
  namespace: readlater
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
spec:
  encryptedData:
    Secret: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/namespace-wide: "true"
      creationTimestamp: null
      name: wallabag-parameters
      namespace: readlater
    data:
      parameters.yml: |
        parameters:
            database_driver: pdo_sqlite
            database_host: 127.0.0.1
            database_port: null
            database_name: null
            database_user: null
            database_password: null
            database_path: /config/db/wallabag.sqlite
            database_table_prefix: wallabag_
            database_socket: null
            database_charset: utf8mb4
            domain_name: 'https://readlater.nikolaiathome.com'
            server_name: 'readlater'
            mailer_dsn: 'smtp://127.0.0.1'
            locale: en
            secret: '{{ index . "Secret" }}'
            twofactor_sender: no-reply@wallabag.org
            fosuser_registration: true
            fosuser_confirmation: true
            fos_oauth_server_access_token_lifetime: 3600
            fos_oauth_server_refresh_token_lifetime: 1209600
            from_email: no-reply@wallabag.org
            rss_limit: 50
            # Not used by this deployment, but required: config.yml
            # (old_sound_rabbit_mq) and services.yml (Predis\Client)
            # interpolate these at container-compile time. Connections are lazy.
            rabbitmq_host: localhost
            rabbitmq_port: 5672
            rabbitmq_user: guest
            rabbitmq_password: guest
            rabbitmq_prefetch_count: 10
            redis_scheme: tcp
            redis_host: localhost
            redis_port: 6379
            redis_path: null
            redis_password: null
            sentry_dsn: null
