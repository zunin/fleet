apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: readlater
  namespace: readlater
spec:
  name: readlater
  namespace: readlater
  recurringJob:
    enabled: true
    cron: "30 0 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/wallabag
    # renovate: datasource=docker depName=ghcr.io/zunin/wallabag
    tag: 2.6.14@sha256:4199addb6ccade3aa4391a049a2d95a51ee34a3a20fec373a1617cf9a44a81fd
    port: 8080
  url: "readlater.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
  externalVolumes:
    # data PVC (upstream layout: db/wallabag.sqlite) now holds the whole
    # wallabag tree: WALLABAG_DATA=/config (app seed, parameters, var/,
    # web/assets/images, db/).
    - name: data
      persistentVolumeClaim: data
      containerMountPath: /config
    # article images: DownloadImages saves to /config/web/assets/images and
    # the image serves /assets/images/* from there via Caddy.
    - name: images
      persistentVolumeClaim: images
      containerMountPath: /config/web/assets/images
  secretMounts:
    - secretName: wallabag-parameters
      mountPath: /params
  env:
    TZ: "Europe/Copenhagen"
  filebrowser:
    enabled: false
    port: 3925
  resources:
    memory: "200Mi"
    cpu: "0.1"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: '/api/info' 
  readOnlyRootFilesystem: false

