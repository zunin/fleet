apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: books
  namespace: books
spec:
  name: books
  namespace: books
  recurringJob:
    enabled: true
    cron: "30 1 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/kavita
    # renovate: datasource=docker depName=ghcr.io/zunin/kavita
    tag: 0.9.1.4@sha256:672bdc00c30ed9173db7b5d19c8dacbf575b2a466c3e44de48306bf0b9861d0d
    port: 5000
  url: "books.nikolaiathome.com"
  localUrl: "books-copyparty.local.nikolaiathome.com"
  replicas: 1
  node: slaaensoe
  ingress:
    enabled: true
    websocketRoutes: "/"
  externalVolumes:
    - name: config
      persistentVolumeClaim: kavita-config
      containerMountPath: /kavita/config
    - name: media
      persistentVolumeClaim: kavita-media
      containerMountPath: /media
  env:
    TZ: "Europe/Copenhagen"
  filebrowser:
    enabled: true
    port: 3928
  resources:
    memory: "512Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/api/Health"
  readOnlyRootFilesystem: false
