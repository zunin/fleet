apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: books
  namespace: books
spec:
  name: books
  namespace: books
  recurringJob:
    enabled: true
    cron: "30 1 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/kavita
    # renovate: datasource=docker depName=ghcr.io/zunin/kavita
    tag: 0.9.1.4@sha256:3ff0000271f2de85f9edeff2eb0706d5f6168f11a8bc6e6c91b019fa7ef98f7a
    port: 5000
  url: "books.nikolaiathome.com"
  localUrl: "books-copyparty.local.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
    websocketRoutes: "/"
  externalVolumes:
    - name: config
      persistentVolumeClaim: kavita-config
      containerMountPath: /kavita/config
    - name: media
      persistentVolumeClaim: kavita-media
      containerMountPath: /media
  env:
    TZ: "Europe/Copenhagen"
  filebrowser:
    enabled: true
    port: 3928
  resources:
    memory: "512Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/api/Health"
  readOnlyRootFilesystem: false
