apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  namespace: books
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/app: books
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-books: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
