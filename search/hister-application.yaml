apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: hister
  namespace: search
spec:
  name: hister
  namespace: search
  recurringJob:
    enabled: true
    cron: "0 1 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/hister
    # renovate: datasource=docker depName=ghcr.io/zunin/hister
    tag: 0.20.0@sha256:4de4cc11d4f3a1919e3114d389183be41c7c4eeeeba64fecfad51f905b06f7d4
    port: 4433
  url: hister.nikolaiathome.com
  replicas: 1
  node: tangesoe
  resources:
    memory: 2Gi
    cpu: 500m
  ingress:
    enabled: true
    websocketRoutes: "/"
  externalVolumes:
    - name: search-data
      persistentVolumeClaim: search-data
      containerMountPath: /hister/search-data
      readOnly: false
  env:
    HISTER__SERVER__ADDRESS: "0.0.0.0:4433"
    HISTER__SERVER__BASE_URL: "https://hister.nikolaiathome.com"
    HISTER_DATA_DIR: "/hister/search-data"
  envFromConfigMaps: []
  secretMounts:
    - secretName: hister-config
      mountPath: /hister/data
      items:
        config.yml: config.yml
  configMapMounts: []
  filebrowser:
    enabled: false
  livenessProbePath: /api/config
  readOnlyRootFilesystem: false
