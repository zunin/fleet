apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
  namespace: rss
spec:
  interval: 15m
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: freshrss
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: freshrss
              spec:
                strategy:
                  type: Recreate
                  rollingUpdate: null
  chart:
    spec:
      chart: freshrss
      version: 1.1.20
      sourceRef:
        kind: HelmRepository
        name: christianhuth
        namespace: rss
  values:
    nodeSelector:
      kubernetes.io/hostname: julsoe
    # renovate: datasource=docker depName=docker.io/freshrss/freshrss
    appversion: 1.30.4
    image:
      # renovate: datasource=docker depName=docker.io/freshrss/freshrss
      tag: 1.30.4
      type: alpine
      registry: docker.io
      repository: freshrss/freshrss
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: cloudflare-issuer
      hosts:
        - host: "rss.nikolaiathome.com"
          paths:
            - path: "/"
              pathType: Prefix
      tls:
        - hosts:
            - "rss.nikolaiathome.com"
          secretName: freshrss-http-tls
    freshrss:
      database:
        type: postgresql
      timezone: Europe/Copenhagen
      persistence:
        data:
          existingClaim: data
        extensions:
          existingClaim: extensions
  valuesFrom:
    - kind: Secret
      name: freshrss-app
      valuesKey: dbname
      targetPath: externalPostgresql.auth.database
    - kind: Secret
      name: freshrss-app
      valuesKey: password
      targetPath: externalPostgresql.auth.password
    - kind: Secret
      name: freshrss-app
      valuesKey: username
      targetPath: externalPostgresql.auth.username
    - kind: Secret
      name: freshrss-app
      valuesKey: port
      targetPath: externalPostgresql.port
    - kind: Secret
      name: freshrss-app
      valuesKey: host
      targetPath: externalPostgresql.hostname


