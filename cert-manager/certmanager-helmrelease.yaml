apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 30m
      # renovate: datasource=helm depName=cert-manager repository=https://charts.jetstack.io
      version: v1.21.3
  values:
    crds:
      enabled: true
      keep: true
