apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: video
  namespace: video
spec:
  name: video
  namespace: video
  recurringJob:
    enabled: true
    cron: "0 7 * * *"
    retain: 2
  container:
    image: ghcr.io/zunin/jellyfin
    # renovate: datasource=docker depName=ghcr.io/zunin/jellyfin
    tag: "12.2@sha256:8c26ce0f283bb4c0ca713526b48ec657cc90524966d343c45f322c31a1086751"
    port: 8096
  url: "video.nikolaiathome.com"
  localUrl: "video-copyparty.local.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
  externalVolumes:
    - name: data
      persistentVolumeClaim: jellyfin-db-volume
      containerMountPath: /config
    - name: video-volume
      persistentVolumeClaim: video-volume
      containerMountPath: /media
    - name: jellyfin-server-cache
      persistentVolumeClaim: jellyfin-server-cache
      containerMountPath: /cache
  env:
    TZ: "Europe/Copenhagen"
    PUID: "5000"
    PGID: "5000"
  filebrowser:
    enabled: true
    port: 3924
  resources:
    memory: "2Gi"
    cpu: "2"
  runAsUser: 5000
  runAsNonRoot: true
  livenessProbePath: '/health' 
  node: tangesoe
