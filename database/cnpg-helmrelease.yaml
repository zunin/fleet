apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: database
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: database
      interval: 30m
      # Operator image follows the chart appVersion (1.30.1).
      # renovate: datasource=helm depName=cloudnative-pg repository=https://cloudnative-pg.github.io/charts
      version: 0.29.2
