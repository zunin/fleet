apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-coredns
  namespace: external-dns
spec:
  interval: 5m
  # The 2026-09-30 upgrade to 1.23.0 timed out inside the default 5m wait:
  # external-dns fatal-exits whenever the CoreDNS etcd is unreachable, so any
  # etcd blip during a rollout breaks readiness checks. 10m + 1 retry.
  timeout: 10m
  upgrade:
    remediation:
      retries: 1
  chart:
    spec:
      chart: external-dns
      # renovate: datasource=helm depName=external-dns repository=https://kubernetes-sigs.github.io/external-dns/
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 5m
  values:
    fullnameOverride: external-dns-coredns
    provider:
      name: coredns
    extraArgs:
      - --coredns-prefix=/skydns/
    env:
      - name: ETCD_URLS
        value: http://etcd-cluster.coredns.svc.cluster.local:2379
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - ingress
      - service
    txtOwnerId: fleet
    txtPrefix: fleet-
    domainFilters:
      - nikolaiathome.com
      - local.nikolaiathome.com
    serviceMonitor:
      enabled: false
