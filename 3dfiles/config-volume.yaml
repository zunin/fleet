apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: 3dfiles
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/app: manyfold
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-manyfold: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
