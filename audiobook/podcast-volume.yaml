apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: podcast
  namespace: audiobook
  labels:
    app.kubernetes.io/component: volume
    app.kubernetes.io/app: audiobook
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/backup-audiobook: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
