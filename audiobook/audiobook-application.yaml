apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: audiobook
  namespace: audiobook
spec:
  name: audiobook
  namespace: audiobook
  recurringJob:
    enabled: true
    cron: "0 5 * * *"
    retain: 2
  container:
    image: ghcr.io/zunin/audiobookshelf
    # renovate: datasource=docker depName=ghcr.io/zunin/audiobookshelf
    tag: 2.37.1-20@sha256:0809320b73d6e66fc0a21fc2d61860165d9d207e9b3369d0c40e82edeccb78f7
    port: 80
  url: "audiobook.nikolaiathome.com"
  localUrl: "audiobook-copyparty.local.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
    websocketRoutes: "/"
  externalVolumes:
    - name: config
      persistentVolumeClaim: config
      containerMountPath: /config
    - name: audiobook
      persistentVolumeClaim: audiobook
      containerMountPath: /audiobook
    - name: metadata
      persistentVolumeClaim: metadata
      containerMountPath: /metadata
    - name: podcast
      persistentVolumeClaim: podcast
      containerMountPath: /podcast
  env:
    TZ: "Europe/Copenhagen"
  filebrowser:
    enabled: true
    port: 3927
  resources:
    memory: "300Mi"
    cpu: "1"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/"
  readOnlyRootFilesystem: false
