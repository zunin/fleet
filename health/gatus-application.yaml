apiVersion: kro.run/v1alpha1
kind: Gatus
metadata:
  name: gatus
  namespace: health
spec:
  name: gatus
  namespace: health
  container:
    image: ghcr.io/zunin/gatus
    # renovate: datasource=docker depName=ghcr.io/zunin/gatus
    tag: 5.37.0@sha256:a6349ab690c7b19ea99c7b9b9dde56d7e4152350ec8632977894d53ff38b2b6a
    port: 8080
  url: "gatus.nikolaiathome.com"
  externalVolumes:
    - name: gatus-data
      persistentVolumeClaim: gatus-data
      containerMountPath: /data
  resources:
    memory: "200Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/health"
