apiVersion: kro.run/v1alpha1
kind: Gatus
metadata:
  name: gatus
  namespace: health
spec:
  name: gatus
  namespace: health
  container:
    image: ghcr.io/zunin/gatus
    # renovate: datasource=docker depName=ghcr.io/zunin/gatus
    tag: 5.38.0@sha256:f0f8c82f6c2ff16abb1a799dffdafa7bc308ecd20a23a4627d78c0f5ed457991
    port: 8080
  url: "gatus.nikolaiathome.com"
  externalVolumes:
    - name: gatus-data
      persistentVolumeClaim: gatus-data
      containerMountPath: /data
  resources:
    memory: "200Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/health"
