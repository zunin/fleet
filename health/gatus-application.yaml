apiVersion: kro.run/v1alpha1
kind: Gatus
metadata:
  name: gatus
  namespace: health
spec:
  name: gatus
  namespace: health
  container:
    image: ghcr.io/zunin/gatus
    # renovate: datasource=docker depName=ghcr.io/zunin/gatus
    tag: 5.38.0@sha256:14de58fb37ac7f4595d461db71e491e70e4426e430d9e413a7dd5da598dea526
    port: 8080
  url: "gatus.nikolaiathome.com"
  externalVolumes:
    - name: gatus-data
      persistentVolumeClaim: gatus-data
      containerMountPath: /data
  resources:
    memory: "200Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/health"
