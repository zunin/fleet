apiVersion: kro.run/v1alpha1
kind: Gatus
metadata:
  name: gatus
  namespace: health
spec:
  name: gatus
  namespace: health
  container:
    image: ghcr.io/zunin/gatus
    # renovate: datasource=docker depName=ghcr.io/zunin/gatus
    tag: 5.37.0@sha256:a84ea7ca32b715a9f710640d72a8d2d66d25711a61d4b4c7cd2e2fb9a2bbdc67
    port: 8080
  url: "gatus.nikolaiathome.com"
  externalVolumes:
    - name: gatus-data
      persistentVolumeClaim: gatus-data
      containerMountPath: /data
  resources:
    memory: "200Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/health"
