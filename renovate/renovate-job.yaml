apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate
spec:
  schedule: '@midnight'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate-bot
              # renovate: datasource=docker
              image: ghcr.io/zunin/renovate:44.151.2@sha256:d42e3d11edfcb3e167e69b3969e70efc22a7de2dccbb955b25aa6e8427911e32
              # nix-images-built image: renovate + git/nix/nodejs (the nix
              # manager's flake.lock lockFileMaintenance); rootless nix store
              # lives in the /tmp/renovate emptyDir, so rootfs stays writable.
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: RENOVATE_BASE_DIR
                  value: '/tmp/renovate/'
                - name: RENOVATE_CONFIG_FILE
                  value: '/opt/renovate/config.json'
                - name: LOG_LEVEL
                  value: debug
              volumeMounts:
                - name: config-volume
                  mountPath: "/opt/renovate/config.json"
                  subPath: config.js
                  readonly: true
                - name: work-volume
                  mountPath: /tmp/renovate/
          restartPolicy: Never
          volumes:
            - name: config-volume
              secret:
                secretName: renovate-config
                items:
                  - key: config.js
                    path: config.js
            - name: work-volume
              emptyDir: {}
