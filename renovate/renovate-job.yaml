apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate
spec:
  schedule: '@midnight'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: renovate-bot
              # renovate: datasource=docker
              image: ghcr.io/zunin/renovate:44.236.2@sha256:1bc55a92db621d5bc3e222c619deb3ff1293db2d681d077494bc1a33432a63b9
              # nix-images-built image: renovate + git/nix/nodejs/flux (the nix
              # manager's flake.lock lockFileMaintenance); rootless nix store
              # lives in the /tmp/renovate emptyDir, so rootfs stays writable.
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              env:
                - name: RENOVATE_BASE_DIR
                  value: '/tmp/renovate/'
                - name: RENOVATE_CONFIG_FILE
                  value: '/opt/renovate/config.json'
                - name: LOG_LEVEL
                  value: debug
                # All tools come from the Nix image. Only permit the packaged
                # Flux generator with a stable release argument; no shell code.
                - name: RENOVATE_BINARY_SOURCE
                  value: global
                - name: RENOVATE_ALLOW_SHELL_EXECUTOR_FOR_POST_UPGRADE_COMMANDS
                  value: "false"
                - name: RENOVATE_ALLOWED_COMMANDS
                  value: '["^update-flux v[0-9]+\\.[0-9]+\\.[0-9]+$"]'
              volumeMounts:
                - name: config-volume
                  mountPath: "/opt/renovate/config.json"
                  subPath: config.js
                  readOnly: true
          restartPolicy: Never
          volumes:
            - name: config-volume
              secret:
                secretName: renovate-config
                items:
                  - key: config.js
                    path: config.js
            # No emptyDir at /tmp/renovate anymore: an emptyDir is
            # root-owned, and nix refuses a $HOME it doesn't own ("falling
            # back to the one defined in passwd ('/')") -> /.cache fails.
            # The image pre-creates /tmp/renovate owned by UID 1000
            # (apps/renovate.nix) and the rootfs is writable; clones + the
            # chroot nix store are ephemeral with the pod either way.
