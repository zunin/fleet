apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: grocy
  namespace: grocy
spec:
  name: grocy
  namespace: grocy
  recurringJob:
    enabled: true
    cron: "0 0 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/grocy
    # renovate: datasource=docker depName=ghcr.io/zunin/grocy
    tag: 4.7.1@sha256:dd4ba1d46c53ace6cabf0a48094ecf59d25099b2a9a48808f277b4ab78b5499a
    port: 8080
  url: "grocy.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
  externalVolumes:
    - name: config
      persistentVolumeClaim: grocy-config-pvc
      containerMountPath: /config
  env:
    TZ: "Europe/Copenhagen"
    GROCY_CULTURE: "da"
    GROCY_CURRENCY: "DKK"
  filebrowser:
    enabled: false
    port: 3929
  resources:
    memory: "662Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/"
  readOnlyRootFilesystem: false
