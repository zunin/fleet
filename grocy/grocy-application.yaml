apiVersion: kro.run/v1alpha1
kind: Application
metadata:
  name: grocy
  namespace: grocy
spec:
  name: grocy
  namespace: grocy
  recurringJob:
    enabled: true
    cron: "0 0 * * *"
    retain: 3
  container:
    image: ghcr.io/zunin/grocy
    # renovate: datasource=docker depName=ghcr.io/zunin/grocy
    tag: 4.7.1@sha256:d7e6a869069142db14eaddb01df7b19401d255131d45be50577b553dffcb5fe4
    port: 8080
  url: "grocy.nikolaiathome.com"
  replicas: 1
  ingress:
    enabled: true
  externalVolumes:
    - name: config
      persistentVolumeClaim: grocy-config-pvc
      containerMountPath: /config
  env:
    TZ: "Europe/Copenhagen"
    GROCY_CULTURE: "da"
    GROCY_CURRENCY: "DKK"
    # PHP sees plain HTTP behind Caddy; without this grocy emits http://
    # asset URLs, which the browser blocks as mixed content on the HTTPS page.
    GROCY_BASE_URL: "https://grocy.nikolaiathome.com"
  filebrowser:
    enabled: false
    port: 3929
  resources:
    memory: "662Mi"
    cpu: "0.5"
  runAsUser: 1000
  runAsNonRoot: true
  livenessProbePath: "/"
  readOnlyRootFilesystem: false
