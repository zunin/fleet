# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: In
      values:
      - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  # Pinned to 1.34: Contour v1.33.7 is only tested against Kubernetes 1.32-1.34.
  # Do not bump to 1.35+ until Contour supports newer clusters.
  version: "v1.34.12+k3s1"
