# Server plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: In
      values:
      - "true"
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  # Upgrade the control plane first; keep agent-plan on 1.34 until validation passes.
  # Contour 1.33.8 and CloudNativePG 1.30.1 support Kubernetes 1.35.
  version: "v1.35.10+k3s1"
