# Agent plan
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: true
  # Wait until the server plan has finished upgrading slaaensoe
  prepare:
    args:
    - prepare
    - server-plan
    image: rancher/k3s-upgrade
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: DoesNotExist
  serviceAccountName: system-upgrade
  upgrade:
    image: rancher/k3s-upgrade
  # Match the validated control-plane version; upgrade workers one at a time.
  # Contour 1.33.8 and CloudNativePG 1.30.1 support Kubernetes 1.36.
  version: "v1.36.6+k3s1"
